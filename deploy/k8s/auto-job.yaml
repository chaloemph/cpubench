# One-shot `cpubench auto` Job on one architecture; uploads to the hub when done.
# Replace HUB_IP and REGISTRY, then pick the architecture with ARCH (amd64 or arm64):
#   sed 's/ARCH/arm64/g' auto-job.yaml | kubectl apply -f - && kubectl logs -f job/cpubench-auto-arm64
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cpubench-auto-ARCH
  labels: {app: cpubench, arch: ARCH}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: ARCH
      containers:
        - name: cpubench
          image: "REGISTRY/cpubench:latest"
          imagePullPolicy: IfNotPresent
          args: ["auto", "--profile", "standard", "--label", "$(NODE_NAME)-k8s", "--machine", "$(NODE_NAME)", "--upload", "http://HUB_IP:8090"]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
            - {name: CPUBENCH_TOKEN, valueFrom: {secretKeyRef: {name: cpubench, key: token, optional: true}}}
            - {name: CPUBENCH_BMC_PASSWORD, valueFrom: {secretKeyRef: {name: cpubench, key: bmcPassword, optional: true}}}
          resources:
            requests: {cpu: "8", memory: 4Gi}
            limits: {cpu: "8", memory: 4Gi}
